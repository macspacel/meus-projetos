
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Horde: Survival</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container"></div>

  <div id="menu" class="screen">
    <div class="menu-content">
      <div class="eyebrow">SURVIVAL PROTOCOL</div>
      <h1>ZOMBIE HORDE</h1>
      <p class="subtitle">A HUMANIDADE ESTÁ EM PERIGO</p>

      <button onclick="startGame()">JOGAR</button>
      <button onclick="showSettings()">CONFIGURAÇÕES</button>
      <button onclick="exitGame()">SAIR</button>

      <p class="footer-note">SURVIVE THE 10 WAVES</p>
    </div>
  </div>

  <div id="settings" class="screen" style="display:none">
    <div class="settings">
      <h2>CONFIGURAÇÕES</h2>

      <label>Áudio: <span id="soundText">Ligado</span></label>
      <button onclick="toggleSound()">ALTERAR ÁUDIO</button>

      <label>Campo de visão: <span id="fovText">100°</span></label>
      <input id="fov" type="range" min="90" max="120"
        value="100" oninput="changeFov(this.value)">

      <button onclick="backMenu()">VOLTAR AO MENU</button>
    </div>
  </div>

  <div id="hud">
    <div class="hud-top">
      <div class="hud-box">
        ONDA <span id="wave">1/10</span>
      </div>
      <div class="hud-box">
        ZUMBIS <span id="enemies">0</span>
      </div>
    </div>

    <div id="crosshair">
      <span></span>
      <span></span>
    </div>

    <div id="message"></div>

    <div class="hud-bottom">
      <div class="health-info">
        <span>VIDA</span>
        <span id="health">100</span>
      </div>
      <div class="health-bar">
        <div id="health-fill"></div>
      </div>
      <div class="kills-info">
        ELIMINAÇÕES: <span id="kills">0</span>
      </div>
      <small>WASD: MOVIMENTO | ← →: OLHAR | ESPAÇO: DISPARAR | ESC: MENU</small>
    </div>
  </div>

  <div id="error-screen" class="screen" style="display:none">
    <h2>ERRO AO INICIAR O JOGO</h2>
    <p id="error-text"></p>
    <button onclick="location.reload()">RECARREGAR</button>
  </div>

  <!-- Biblioteca 3D -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- Código principal -->
  <script src="game.js"></script>

</body>
</html>
